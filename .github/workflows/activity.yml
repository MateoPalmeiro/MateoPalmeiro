name: Update Activity Graph

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.py
      - .github/workflows/activity.yml

concurrency:
  group: activity-graph
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/activity.py
      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.svg
          if ! git diff --staged --quiet; then
            git commit -m "docs: update activity graph"
            git pull --rebase
            git push
          fi
